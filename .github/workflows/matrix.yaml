name: Node Matrix Pipeline

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  node:
     runs-on: wsl-linux
     strategy:
       matrix:
         node-version: [24, 26]
         
     steps:
       - name: Clone code
         uses: actions/checkout@v7

       - name: Setup NodeJs
         uses: actions/setup-node@v7
         with:
           node-version: ${{ matrix.node-version }}

       - name: Install Dependencies
         run: npm install

       - name:  Create .env file
         run: |
           echo "PORT=8080" >> .env.development
           echo "APP=GHA-NODE-DEV-APP" >> .env.development
           echo "PORT=5000" >> .env.production
           echo "APP=GHA-NODE-PROD-APP" >> .env.production
           
       - name: Run the application
         run: |
            node app.js &
            sleep 5
            curl  http://localhost:8080
            curl  http://localhost:8080/health
            pkill -f "node app.js"
            
           
